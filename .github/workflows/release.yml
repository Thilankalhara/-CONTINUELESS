name: Build desktop installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }} installer
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            command: npx electron-builder --win nsis --publish never
          - name: macOS
            runner: macos-latest
            command: npx electron-builder --mac dmg zip --x64 --arm64 --publish never
          - name: Linux
            runner: ubuntu-latest
            command: npx electron-builder --linux AppImage deb --publish never

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package installer
        run: ${{ matrix.command }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          overwrite_files: true
          files: |
            installers/**/CONTINUELESS-*.exe
            installers/**/*.dmg
            installers/**/*.zip
            installers/**/*.AppImage
            installers/**/*.deb

      - name: Remove Windows installer support files
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = context.ref.replace('refs/tags/', '');
            const { data: releases } = await github.rest.repos.listReleases({ owner, repo });
            const release = releases.find(item => item.tag_name === tag);
            if (!release) throw new Error(`Release for ${tag} was not found.`);

            for (const asset of release.assets) {
              if (asset.name === 'CONTINUELESS.exe' || asset.name === 'elevate.exe') {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
              }
            }
